name: Assemble Site
run-name: Assemble content ${{ inputs.content_commit || 'main (resolve once)' }}

on:
  push:
    branches:
      - main

    # 仅改动 CI 配置的推送不该触发重新拼装。
    # .github/ 不会被复制进 site，所以这类推送唯一的效果是让
    # .site-build.json 的 commit 哈希跳一下 —— 产生一个内容为空的
    # "assemble site" 提交，并白白触发一次 Cloudflare Pages 重新部署。
    # 要验证本文件的改动，用下面的 workflow_dispatch 手动触发。
    paths-ignore:
      - ".github/**"

  workflow_dispatch:
    inputs:
      content_commit:
        description: Full content commit SHA; leave empty to resolve main once
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: assemble-site
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Blog
        uses: actions/checkout@v4
        with:
          path: blog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Resolve immutable Content revision
        id: content
        working-directory: blog
        env:
          REQUESTED_CONTENT_COMMIT: ${{ inputs.content_commit }}
          CONTENT_READ_TOKEN: ${{ secrets.BLOG_CONTENT_TOKEN }}
        run: node scripts/assembly-provenance.ts

      - name: Checkout Blog-Content
        uses: actions/checkout@v4
        with:
          repository: XAN9xXx/blog-content
          ref: ${{ steps.content.outputs.commit }}
          persist-credentials: false
          token: ${{ secrets.BLOG_CONTENT_TOKEN }}
          path: xan9x-blog-content

      - name: Checkout Site
        uses: actions/checkout@v4
        with:
          repository: XAN9xXx/site
          token: ${{ secrets.SITE_TOKEN }}
          path: xan9x-site

      - name: Read pinned Topology revision
        id: topology
        working-directory: blog
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const source = JSON.parse(fs.readFileSync("topology-source.json", "utf8"));
            if (source.repository !== "XAN9xXx/blog-topology" || !/^[a-f0-9]{40}$/.test(source.commit ?? "")) {
              throw new Error("Set topology-source.json to the first approved/pushed full commit SHA; refusing floating main.");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + source.commit + "\n");
          '

      - name: Checkout pinned Topology
        uses: actions/checkout@v4
        with:
          repository: XAN9xXx/blog-topology
          ref: ${{ steps.topology.outputs.commit }}
          token: ${{ secrets.BLOG_TOPOLOGY_TOKEN }}
          path: xan9x-blog-topology
          persist-credentials: false

      - name: Validate Topology module
        working-directory: xan9x-blog-topology
        run: |
          npm ci
          npm run check
          npm test

      - name: Prepare Topology package
        working-directory: blog
        run: npm run topology:prepare -- --source ../xan9x-blog-topology

      - name: Install Blog dependencies
        working-directory: blog
        run: npm ci

      - name: Validate Blog and Content
        working-directory: blog
        env:
          BLOG_CONTENT_DIR: ../xan9x-blog-content
        run: |
          npm run check
          npm test
          npm run validate:content
          npm run workbench:build

      - name: Assemble Site
        working-directory: blog
        env:
          BLOG_CONTENT_SOURCE: ${{ github.workspace }}/xan9x-blog-content
          SITE_DIR: ${{ github.workspace }}/xan9x-site
          ASSEMBLY_CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          ASSEMBLY_REPOSITORY: ${{ github.repository }}
          ASSEMBLY_RUN_ID: ${{ github.run_id }}
          ASSEMBLY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npm run assemble

      - name: Install generated Site dependencies
        working-directory: xan9x-site
        run: npm ci

      - name: Build generated Site
        working-directory: xan9x-site
        env:
          BLOG_CONTENT_DIR: ./content
        run: npm run build

      - name: Commit generated Site
        id: site
        working-directory: xan9x-site
        run: |
          git config user.name "xan9x-site-bot"
          git config user.email "xan9x-site-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "assemble site"
            git push
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record assembled revision chain
        env:
          CONTENT_COMMIT: ${{ steps.content.outputs.commit }}
          TOPOLOGY_COMMIT: ${{ steps.topology.outputs.commit }}
          SITE_COMMIT: ${{ steps.site.outputs.commit }}
        run: |
          printf '## Assembled revisions\n\n- Blog: `%s`\n- Content: `%s`\n- Topology: `%s`\n- Site: `%s`\n\nCloudflare deployment is not verified by this job.\n' \
            "$GITHUB_SHA" "$CONTENT_COMMIT" "$TOPOLOGY_COMMIT" "$SITE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
